<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ topic.title }}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1>{{ topic.title }}</h1>
        <h2>Комментарии:</h2>
        <ul class="list-group">
            {% for comment in topic.comments %}
                <li class="list-group-item">{{ comment.content }}</li>
            {% endfor %}
        </ul>
        <form method="POST" class="mt-3">
            <textarea name="content" class="form-control" rows="3" placeholder="Ваш комментарий" required></textarea>
            <button type="submit" class="btn btn-primary mt-2">Добавить комментарий</button>
        </form>
        <a href="{{ url_for('index') }}" class="btn btn-secondary mt-4">На главную</a>
    </div>
</body>
</html>
