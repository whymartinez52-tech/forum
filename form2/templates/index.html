<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная - Форум жалоб</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f13; font-family: 'Segoe UI', sans-serif; color: #e0e0e0; padding: 2rem; }
        .container { max-width: 1100px; margin: 0 auto; }
        .hero { background: #1a1a2e; border-radius: 2rem; padding: 3rem; text-align: center; margin-bottom: 2rem; }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; background: linear-gradient(135deg, #fff, #f97316); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem; }
        .btn { background: #2a2a3a; padding: 0.75rem 1.5rem; border-radius: 2rem; text-decoration: none; color: white; transition: 0.2s; }
        .btn-primary { background: #f97316; }
        .btn-danger { background: #b91c1c; }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .user-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding: 1rem; background: #1a1a2e; border-radius: 1rem; }
        .admin-badge { background: #f97316; padding: 0.2rem 0.8rem; border-radius: 1rem; font-size: 0.8rem; margin-left: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-bar">
            <span>👤 {{ username }} {% if is_admin %}<span class="admin-badge">Администратор</span>{% endif %}</span>
            <a href="{{ url_for('logout') }}" class="btn" style="background:#b91c1c;">🚪 Выйти</a>
        </div>
        <div class="hero">
            <h1>⚖️ Форум жалоб</h1>
            <p>Сообщество — справедливость, жалобы, правила</p>
            <div class="nav">
                <a href="/rules" class="btn">📜 Правила</a>
                <a href="/complaints" class="btn btn-primary">📋 Жалобы</a>
                <a href="/faq" class="btn">❓ FAQ</a>
                {% if is_admin %}
                    <a href="/moderation" class="btn" style="background:#2563eb;">🛡️ Модерация</a>
                    <a href="/admin_panel" class="btn" style="background:#8b5cf6;">👑 Выдать права</a>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
