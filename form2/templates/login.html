<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход - Форум жалоб</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0f0f13, #1a1a2e); font-family: 'Segoe UI', sans-serif; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #1e1e2a; border-radius: 2rem; padding: 2.5rem; width: 100%; max-width: 450px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        h1 { font-size: 2rem; margin-bottom: 1rem; text-align: center; background: linear-gradient(135deg, #fff, #f97316); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input { width: 100%; padding: 0.75rem; background: #2a2a3a; border: 1px solid #3a3a4a; border-radius: 1rem; color: white; font-size: 1rem; }
        button { width: 100%; background: #f97316; padding: 0.75rem; border: none; border-radius: 1rem; color: white; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button:hover { background: #ff8333; transform: scale(0.98); }
        .flash { background: #15803d; padding: 0.75rem; border-radius: 1rem; margin-bottom: 1rem; text-align: center; }
        .flash-error { background: #b91c1c; }
        .link { text-align: center; margin-top: 1rem; }
        a { color: #f97316; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Вход на форум</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, msg in messages %}
                <div class="flash {% if category == 'error' %}flash-error{% endif %}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Войти</button>
        </form>
        <div class="link">
            <a href="{{ url_for('register') }}">Нет аккаунта? Зарегистрироваться</a>
        </div>
    </div>
</body>
</html>
